[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spotify2yt"
version = "0.1.0"
description = "Transfer Spotify playlists to YouTube Music"
requires-python = ">=3.10"
dependencies = [
    "spotipy>=2.24.0,<3",
    "ytmusicapi>=1.8.0,<2",
    "typer>=0.12.0,<1",
    "rich>=13.0.0",
    "keyring>=25.0.0",
    "rapidfuzz>=3.0.0",
    "cryptography>=42.0.0",
    "platformdirs>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
]

[project.scripts]
spotify2yt = "spotify2yt.cli:app_runner"

[tool.hatch.build.targets.wheel]
packages = ["src/spotify2yt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
